name: CI/CD - Auto Merge & Deploy

on:
  push:
    branches:
      - 'claude/**'
      - master

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Auto-merge claude/* branches into master
  auto-merge:
    if: startsWith(github.ref, 'refs/heads/claude/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge into master
        run: |
          git fetch origin master:master
          git checkout master
          git merge --ff-only ${{ github.ref_name }} || git merge --no-edit ${{ github.ref_name }}
          git push origin master

  # Deploy master to GitHub Pages
  deploy:
    needs: [auto-merge]
    if: always() && (needs.auto-merge.result == 'success' || (github.ref == 'refs/heads/master' && needs.auto-merge.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to gh-pages
        run: |
          git fetch origin gh-pages:gh-pages
          git checkout gh-pages
          git checkout master -- index.html CLAUDE.md
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy $(git log master -1 --pretty='%h: %s')"
            git push origin gh-pages
          fi
